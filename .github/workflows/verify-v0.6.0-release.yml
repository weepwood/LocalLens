name: Verify v0.6.0 Release

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v0.6.0 --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,assets > release.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("release.json").read_text(encoding="utf-8"))
          assert data["tagName"] == "v0.6.0", data
          assert data["isDraft"] is False, data
          assert data["isPrerelease"] is False, data
          expected = {
              "LocalLens-Server-Windows-x64.zip",
              "LocalLens-Client-Windows-x64.zip",
              "LocalLens-Android-universal.apk",
              "SHA256SUMS.txt",
          }
          assets = {item["name"]: item for item in data.get("assets", [])}
          missing = expected.difference(assets)
          assert not missing, f"missing assets: {sorted(missing)}"
          for name in expected:
              assert int(assets[name].get("size", 0)) > 0, f"empty asset: {name}"
          PY

      - name: Download and inspect unified Windows package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download v0.6.0 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "LocalLens-Client-Windows-x64.zip" \
            --pattern "SHA256SUMS.txt" \
            --dir release-assets

          python3 - <<'PY'
          import hashlib
          import json
          import zipfile
          from pathlib import Path

          archive = Path("release-assets/LocalLens-Client-Windows-x64.zip")
          checksum_file = Path("release-assets/SHA256SUMS.txt")
          expected_hash = None
          for line in checksum_file.read_text(encoding="utf-8").splitlines():
              parts = line.strip().split(maxsplit=1)
              if len(parts) == 2 and parts[1].lstrip("*").endswith(archive.name):
                  expected_hash = parts[0].lower()
                  break
          assert expected_hash, "client checksum not found"
          actual_hash = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert actual_hash == expected_hash, (actual_hash, expected_hash)

          rows = []
          with zipfile.ZipFile(archive) as zf:
              entries = {info.filename.replace("\\", "/"): info for info in zf.infolist()}
              required_suffixes = [
                  "/LocalLens.exe",
                  "/runtime/LocalLensServer.exe",
                  "/runtime/media-tools/README.txt",
              ]
              for suffix in required_suffixes:
                  matches = [(name, info) for name, info in entries.items() if name.endswith(suffix)]
                  assert matches, f"missing {suffix}"
                  name, info = matches[0]
                  assert info.file_size > 0, f"empty {name}"
                  rows.append(f"{name}\t{info.file_size}")

          Path("client-package.txt").write_text("\n".join(rows) + "\n", encoding="utf-8")
          release = json.loads(Path("release.json").read_text(encoding="utf-8"))
          assets = {item["name"]: int(item["size"]) for item in release["assets"]}
          Path("verification.txt").write_text(
              "tag=v0.6.0\n"
              "draft=false\n"
              "prerelease=false\n"
              "unified_client_contains_server=true\n"
              "unified_client_checksum=true\n"
              + "\n".join(f"{name}={size}" for name, size in sorted(assets.items()))
              + "\n",
              encoding="utf-8",
          )
          PY
          cat client-package.txt
          cat verification.txt

      - name: Upload verification metadata
        uses: actions/upload-artifact@v7
        with:
          name: v0.6.0-release-verification
          path: |
            verification.txt
            client-package.txt
          if-no-files-found: error
          retention-days: 7
