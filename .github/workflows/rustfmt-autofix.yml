name: Rustfmt Autofix

on:
  push:
    branches:
      - feat/data-safety-center

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[rustfmt]') }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出当前分支
        uses: actions/checkout@v7
        with:
          ref: feat/data-safety-center
          fetch-depth: 0
      - name: 配置 Rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: 格式化 Rust 代码
        run: cargo fmt --manifest-path rust/Cargo.toml --all
      - name: 提交格式化结果
        shell: bash
        run: |
          if git diff --quiet; then
            echo "没有需要提交的格式变更"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "样式：应用 rustfmt [rustfmt]"
          git push origin HEAD:feat/data-safety-center
