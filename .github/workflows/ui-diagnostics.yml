name: UI Diagnostics

on:
  push:
    branches: ["feat/ui-refresh-v0.3"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-diagnostics:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/local_lens
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Generate Android platform project
        shell: bash
        run: |
          flutter create \
            --project-name local_lens \
            --org com.weepwood \
            --platforms android \
            .
          flutter pub get

      - name: Test and analyze
        id: diagnostics
        continue-on-error: true
        shell: bash
        run: |
          set +e
          flutter test > diagnostics.txt 2>&1
          TEST_STATUS=$?
          echo "" >> diagnostics.txt
          echo "===== FLUTTER ANALYZE =====" >> diagnostics.txt
          flutter analyze >> diagnostics.txt 2>&1
          ANALYZE_STATUS=$?
          echo "" >> diagnostics.txt
          echo "test_status=$TEST_STATUS" >> diagnostics.txt
          echo "analyze_status=$ANALYZE_STATUS" >> diagnostics.txt
          cat diagnostics.txt
          exit $(( TEST_STATUS != 0 || ANALYZE_STATUS != 0 ))

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-diagnostics
          path: apps/local_lens/diagnostics.txt
          if-no-files-found: error
          retention-days: 7
