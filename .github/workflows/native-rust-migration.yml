name: Native Rust Migration

on:
  pull_request:
    branches: [main]
    paths:
      - "rust/**"
      - "apps/local_lens_desktop/**"
      - "apps/local_lens_android/**"
      - "docs/native-rust-migration.md"
      - ".github/workflows/native-rust-migration.yml"
  push:
    branches: [main]
    paths:
      - "rust/**"
      - "apps/local_lens_desktop/**"
      - "apps/local_lens_android/**"
      - ".github/workflows/native-rust-migration.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: local-lens-native-rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-core:
    name: Rust core and API
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: /tmp/local-lens-target
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install FFmpeg for video regression
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Format Rust sources
        run: |
          cargo fmt --all
          cargo fmt --manifest-path ../apps/local_lens_desktop/src-tauri/Cargo.toml
      - name: Commit formatted sources
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git -C .. config user.name "github-actions[bot]"
          git -C .. config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .. add rust/crates apps/local_lens_desktop/src-tauri/src apps/local_lens_desktop/src-tauri/build.rs
          if git -C .. diff --cached --quiet; then
            echo "Rust 源码已经符合 rustfmt"
          else
            git -C .. commit -m "格式化 Rust 工作区源码"
            git -C .. push origin "HEAD:${HEAD_BRANCH}"
          fi
      - name: Run Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee clippy.log
      - name: Test Rust workspace
        shell: bash
        env:
          FFMPEG_PATH: /usr/bin/ffmpeg
          FFPROBE_PATH: /usr/bin/ffprobe
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee test.log
      - name: Upload Rust logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: LocalLens-Rust-Logs
          path: |
            rust/clippy.log
            rust/test.log
          if-no-files-found: warn
          retention-days: 7

  tauri-windows:
    name: Tauri 2 desktop · Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/local_lens_desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/local_lens_desktop/package.json
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Build React frontend
        shell: pwsh
        run: |
          npm run build 2>&1 | Tee-Object -FilePath frontend-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check Tauri Rust host
        shell: pwsh
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml 2>&1 | Tee-Object -FilePath tauri-check.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Tauri logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: LocalLens-Tauri-Logs
          path: |
            apps/local_lens_desktop/frontend-build.log
            apps/local_lens_desktop/tauri-check.log
          if-no-files-found: warn
          retention-days: 7

  android-native:
    name: Kotlin Android native APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/local_lens_android
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"
      - name: Build native Android debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee android-build.log
      - name: Upload Android log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: LocalLens-Android-Logs
          path: apps/local_lens_android/android-build.log
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: LocalLens-Native-Android-debug
          path: apps/local_lens_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
