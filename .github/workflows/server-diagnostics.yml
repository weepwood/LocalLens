name: Server Diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-windows:
    name: Capture Go test output · Windows x64
    runs-on: windows-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod

      - name: Resolve module graph
        run: go mod tidy

      - name: Run tests and capture output
        id: tests
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $output = & go test -v ./... 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath "server-test.log"
          "exit_code=$exitCode" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          exit $exitCode

      - name: Upload module files and test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-module-diagnostics
          path: |
            server/go.mod
            server/go.sum
            server/server-test.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce test result
        if: steps.tests.outcome == 'failure'
        shell: pwsh
        run: exit 1
