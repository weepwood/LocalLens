name: Diagnose unified host

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/local_lens
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Capture tests and analyzer
        shell: bash
        run: |
          set +e
          flutter test > test-output.txt 2>&1
          TEST_EXIT=$?
          flutter analyze > analyze-output.txt 2>&1
          ANALYZE_EXIT=$?
          echo "test_exit=$TEST_EXIT" > diagnostic-summary.txt
          echo "analyze_exit=$ANALYZE_EXIT" >> diagnostic-summary.txt
          cat test-output.txt
          cat analyze-output.txt
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: unified-host-diagnostics
          path: |
            apps/local_lens/test-output.txt
            apps/local_lens/analyze-output.txt
            apps/local_lens/diagnostic-summary.txt
          if-no-files-found: error
          retention-days: 7
