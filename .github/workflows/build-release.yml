name: Build and Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "发布标签，例如 v0.7.0"
        required: true
        default: "v0.7.0"
        type: string

permissions:
  contents: read

concurrency:
  group: local-lens-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.13"
  FFMPEG_URL: "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"

jobs:
  rust-tests:
    name: Rust 后端测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 检查旧实现已清理
        working-directory: .
        shell: bash
        run: |
          test ! -d server
          test ! -d apps/local_lens
          test ! -d apps/local_lens_mobile
          if git grep -nE 'server/config\.example\.json|apps/local_lens_mobile|apps/local_lens/' -- . ':!.github/workflows/build-release.yml'; then
            echo "发现旧实现路径残留" >&2
            exit 1
          fi
      - name: 配置 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: 缓存 Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: 安装真实视频回归依赖
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: 检查 Rust 格式
        run: cargo fmt --all -- --check
      - name: 执行 Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: 执行后端回归测试
        env:
          FFMPEG_PATH: /usr/bin/ffmpeg
          FFPROBE_PATH: /usr/bin/ffprobe
        run: cargo test --workspace

  tauri-windows:
    name: Tauri 2 Windows 安装包
    needs: rust-tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/local_lens_desktop
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/local_lens_desktop/package.json
      - name: 配置 Rust
        uses: dtolnay/rust-toolchain@stable
      - name: 缓存 Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            apps/local_lens_desktop/src-tauri
      - name: 安装前端依赖
        run: npm install --no-audit --no-fund
      - name: 下载并准备 FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $extract = Join-Path $env:RUNNER_TEMP "ffmpeg"
          Invoke-WebRequest -Uri $env:FFMPEG_URL -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $ffmpeg = Get-ChildItem $extract -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem $extract -Filter "ffprobe.exe" -Recurse | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) {
            throw "FFmpeg 压缩包中缺少 ffmpeg.exe 或 ffprobe.exe"
          }
          $target = Join-Path $PWD "src-tauri/runtime/media-tools"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item $ffmpeg.FullName (Join-Path $target "ffmpeg.exe") -Force
          Copy-Item $ffprobe.FullName (Join-Path $target "ffprobe.exe") -Force
          @"
          FFmpeg third-party notice
          =========================
          Windows binaries: https://www.gyan.dev/ffmpeg/builds/
          FFmpeg source and licensing: https://ffmpeg.org/
          The bundled executable is a separate third-party program. Review the
          applicable FFmpeg build license before redistributing LocalLens.
          "@ | Set-Content -Path (Join-Path $target "FFMPEG-LICENSE.txt") -Encoding UTF8
      - name: 构建 Tauri 安装包
        shell: pwsh
        run: |
          & npm run tauri -- build *>&1 | Tee-Object -FilePath tauri-build.log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            exit $exitCode
          }
      - name: 上传 Tauri 构建日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: LocalLens-Tauri-Build-Log
          path: apps/local_lens_desktop/tauri-build.log
          if-no-files-found: warn
          retention-days: 7
      - name: 构建 Rust 独立服务
        shell: pwsh
        run: |
          cargo build --release --manifest-path ../../rust/Cargo.toml -p local-lens-server --bin local-lens-server
          $dist = Join-Path $PWD "dist/LocalLens-Rust-Server-Windows-x64"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "../../rust/target/release/local-lens-server.exe" (Join-Path $dist "LocalLensServer.exe")
          Copy-Item "../../config.example.json" (Join-Path $dist "config.example.json")
          Copy-Item "src-tauri/runtime/media-tools/*" $dist -Force
          Compress-Archive -Path $dist -DestinationPath "dist/LocalLens-Rust-Server-Windows-x64.zip" -Force
      - name: 汇总 Windows 产物
        shell: pwsh
        run: |
          $output = Join-Path $PWD "dist/windows"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          Get-ChildItem "src-tauri/target/release/bundle" -Include "*.msi","*.exe" -Recurse |
            Copy-Item -Destination $output -Force
          Copy-Item "dist/LocalLens-Rust-Server-Windows-x64.zip" $output -Force
          if (-not (Get-ChildItem $output -File)) { throw "没有生成 Windows 产物" }
      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v7
        with:
          name: LocalLens-Tauri-Windows-x64
          path: apps/local_lens_desktop/dist/windows/*
          if-no-files-found: error
          retention-days: 30

  android-native:
    name: Kotlin 原生 Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/local_lens_android
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 配置 Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: 构建原生 Android APK
        run: gradle :app:assembleDebug --stacktrace
      - name: 整理 Android 产物
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/LocalLens-Native-Android.apk
      - name: 上传 Android 产物
        uses: actions/upload-artifact@v7
        with:
          name: LocalLens-Native-Android
          path: apps/local_lens_android/dist/LocalLens-Native-Android.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: 发布 GitHub Release
    needs:
      - tauri-windows
      - android-native
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main' &&
       startsWith(github.event.head_commit.message, 'release:'))
    permissions:
      contents: write
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v5
        with:
          pattern: LocalLens-*
          path: dist
          merge-multiple: true
      - name: 生成 SHA-256 校验文件
        run: |
          cd dist
          find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: 确定发布标签
        id: release_tag
        env:
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${MANUAL_TAG}"
          else
            TAG="v0.7.0"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "无效标签：$TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: 创建或更新 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: LocalLens ${{ steps.release_tag.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*
