name: Build and Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v0.6.1"
        required: true
        default: "v0.6.1"
        type: string

permissions:
  contents: read

concurrency:
  group: local-lens-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  server-windows:
    name: Go server · Windows x64
    runs-on: windows-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.mod
            server/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Test server
        run: go test ./...

      - name: Build standalone and embedded servers
        shell: pwsh
        env:
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $packageName = "LocalLens-Server-Windows-x64"
          $packageDir = Join-Path $PWD "dist/$packageName"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null

          $version = "0.6.1-dev"
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME.TrimStart("v")
          } elseif ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch" -and $env:MANUAL_TAG) {
            $version = $env:MANUAL_TAG.TrimStart("v")
          }

          go build -trimpath `
            -ldflags "-s -w -X main.version=$version" `
            -o (Join-Path $packageDir "LocalLensServer.exe") .

          go build -trimpath `
            -ldflags "-H=windowsgui -s -w -X main.version=$version" `
            -o (Join-Path $packageDir "LocalLensServerEmbedded.exe") .

          Copy-Item "config.example.json" (Join-Path $packageDir "config.example.json")
          New-Item -ItemType Directory -Force -Path (Join-Path $packageDir "bin") | Out-Null

          @"
          LocalLens Server $version
          ==========================

          Standalone mode:
          1. Copy config.example.json to config.json.
          2. Edit media library paths, public_url and api_token.
          3. Put ffmpeg.exe and ffprobe.exe in .\bin\ when video transcoding is needed.
          4. Start LocalLensServer.exe -config .\config.json.

          LocalLensServerEmbedded.exe is used by the unified Windows application.
          Ordinary Windows users should download LocalLens-Windows-x64.zip.
          "@ | Set-Content -Path (Join-Path $packageDir "START-HERE.txt") -Encoding UTF8

          $zipPath = Join-Path $PWD "dist/$packageName.zip"
          Compress-Archive -Path "$packageDir\*" -DestinationPath $zipPath -Force

      - name: Upload server artifact
        uses: actions/upload-artifact@v7
        with:
          name: LocalLens-Server-Windows-x64
          path: server/dist/LocalLens-Server-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  flutter-windows:
    name: Unified Windows application · x64
    needs: server-windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/local_lens

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download embedded server artifact
        uses: actions/download-artifact@v5
        with:
          name: LocalLens-Server-Windows-x64
          path: ${{ runner.temp }}/local-lens-server

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate Windows platform project
        shell: pwsh
        run: |
          flutter create `
            --project-name local_lens `
            --org com.weepwood `
            --platforms windows `
            .
          flutter pub get

      - name: Test Flutter application
        run: flutter test

      - name: Analyze Flutter application
        run: flutter analyze

      - name: Build Windows application
        shell: pwsh
        env:
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          $version = "0.6.1"
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME.TrimStart("v")
          } elseif ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch" -and $env:MANUAL_TAG) {
            $version = $env:MANUAL_TAG.TrimStart("v")
          }
          flutter build windows --release --build-name $version --build-number $env:GITHUB_RUN_NUMBER

      - name: Package unified Windows application
        shell: pwsh
        env:
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $packageName = "LocalLens-Windows-x64"
          $packageDir = Join-Path $PWD "dist/$packageName"
          $releaseDir = Join-Path $PWD "build/windows/x64/runner/Release"

          if (-not (Test-Path $releaseDir)) {
            throw "Flutter Windows release directory was not generated: $releaseDir"
          }

          if (Test-Path $packageDir) {
            Remove-Item $packageDir -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item "$releaseDir\*" $packageDir -Recurse -Force

          # Flutter derives the executable from the Dart project name and normally
          # produces local_lens.exe. The public bundle contract uses LocalLens.exe.
          $clientExe = Get-ChildItem $packageDir -File -Filter "*.exe" |
            Where-Object { $_.Name -notlike "LocalLensServer*" } |
            Select-Object -First 1
          if (-not $clientExe) {
            throw "Flutter build output does not contain a desktop executable"
          }
          $normalizedClientExe = Join-Path $packageDir "LocalLens.exe"
          if ($clientExe.FullName -ne $normalizedClientExe) {
            Move-Item -Path $clientExe.FullName -Destination $normalizedClientExe -Force
          }

          $version = "0.6.1"
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME.TrimStart("v")
          } elseif ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch" -and $env:MANUAL_TAG) {
            $version = $env:MANUAL_TAG.TrimStart("v")
          }

          $serverArtifactDir = Join-Path $env:RUNNER_TEMP "local-lens-server"
          $serverZip = Get-ChildItem $serverArtifactDir -Filter "*.zip" -Recurse | Select-Object -First 1
          if (-not $serverZip) {
            throw "Embedded server artifact zip was not found"
          }

          $serverExtractDir = Join-Path $env:RUNNER_TEMP "local-lens-server-extracted"
          if (Test-Path $serverExtractDir) {
            Remove-Item $serverExtractDir -Recurse -Force
          }
          Expand-Archive -Path $serverZip.FullName -DestinationPath $serverExtractDir -Force

          $embeddedServer = Get-ChildItem $serverExtractDir `
            -Filter "LocalLensServerEmbedded.exe" `
            -Recurse |
            Select-Object -First 1
          if (-not $embeddedServer) {
            throw "LocalLensServerEmbedded.exe was not found in server artifact"
          }

          $runtimeDir = Join-Path $packageDir "runtime"
          $mediaToolsDir = Join-Path $runtimeDir "media-tools"
          New-Item -ItemType Directory -Force -Path $mediaToolsDir | Out-Null
          Copy-Item $embeddedServer.FullName (Join-Path $runtimeDir "LocalLensServer.exe") -Force

          @"
          Optional media tools
          ====================

          Put ffmpeg.exe and ffprobe.exe in this directory to enable video
          thumbnails, broad metadata compatibility and HLS transcoding.
          The embedded Go server is already included and does not require FFmpeg.
          "@ | Set-Content -Path (Join-Path $mediaToolsDir "README.txt") -Encoding UTF8

          $manifest = [ordered]@{
            package = $packageName
            client_version = $version
            server_version = $version
            source_commit = $env:GITHUB_SHA
            build_number = $env:GITHUB_RUN_NUMBER
            client_executable = "LocalLens.exe"
            embedded_server = "runtime/LocalLensServer.exe"
            built_at_utc = (Get-Date).ToUniversalTime().ToString("o")
          }
          $manifest | ConvertTo-Json | Set-Content `
            -Path (Join-Path $packageDir "BUNDLE-MANIFEST.json") `
            -Encoding UTF8

          @"
          LocalLens Windows $version
          ==========================

          This is the unified Windows package. Launch LocalLens.exe only.
          It starts runtime\LocalLensServer.exe and connects through 127.0.0.1.
          Server data is stored under %LOCALAPPDATA%\LocalLens.
          "@ | Set-Content -Path (Join-Path $packageDir "START-HERE.txt") -Encoding UTF8

          $requiredFiles = @(
            (Join-Path $packageDir "LocalLens.exe"),
            (Join-Path $packageDir "flutter_windows.dll"),
            (Join-Path $packageDir "runtime/LocalLensServer.exe"),
            (Join-Path $packageDir "runtime/media-tools/README.txt"),
            (Join-Path $packageDir "BUNDLE-MANIFEST.json")
          )
          foreach ($requiredFile in $requiredFiles) {
            if (-not (Test-Path $requiredFile)) {
              throw "Unified Windows package is missing $requiredFile"
            }
          }

          $zipPath = Join-Path $PWD "dist/$packageName.zip"
          Compress-Archive -Path "$packageDir\*" -DestinationPath $zipPath -Force

      - name: Smoke test final Windows zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packageName = "LocalLens-Windows-x64"
          $zipPath = Join-Path $PWD "dist/$packageName.zip"
          $smokeRoot = Join-Path $env:RUNNER_TEMP "local-lens-unified-smoke"

          if (Test-Path $smokeRoot) {
            Remove-Item $smokeRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $smokeRoot | Out-Null
          Expand-Archive -Path $zipPath -DestinationPath $smokeRoot -Force

          $clientPath = Join-Path $smokeRoot "LocalLens.exe"
          $serverPath = Join-Path $smokeRoot "runtime/LocalLensServer.exe"
          $manifestPath = Join-Path $smokeRoot "BUNDLE-MANIFEST.json"
          foreach ($requiredPath in @($clientPath, $serverPath, $manifestPath)) {
            if (-not (Test-Path $requiredPath)) {
              throw "Final Windows zip is missing $requiredPath"
            }
          }

          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.client_executable -ne "LocalLens.exe") {
            throw "Bundle manifest does not describe LocalLens.exe"
          }
          if ($manifest.embedded_server -ne "runtime/LocalLensServer.exe") {
            throw "Bundle manifest does not describe the embedded server"
          }

          $port = 19527
          $dataDir = Join-Path $smokeRoot "server-data"
          $mediaDir = Join-Path $smokeRoot "media"
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          New-Item -ItemType Directory -Force -Path $mediaDir | Out-Null
          $configPath = Join-Path $smokeRoot "server-smoke.json"
          $config = [ordered]@{
            listen_address = "127.0.0.1:$port"
            public_url = ""
            server_name = "LocalLens CI Smoke"
            data_dir = $dataDir
            api_token = "ci-smoke-token-with-more-than-16-characters"
            ffmpeg_path = ""
            ffprobe_path = ""
            auto_scan = $false
            watch_files = $false
            thumbnail_workers = 1
            metadata_workers = 1
            transcode_workers = 1
            transcode_cache_gb = 1
            transcode_hardware = "software"
            pairing_ttl_minutes = 5
            libraries = @(
              [ordered]@{
                id = "smoke"
                name = "Smoke Library"
                path = $mediaDir
                recursive = $true
                enabled = $true
              }
            )
          }
          $config | ConvertTo-Json -Depth 5 | Set-Content -Path $configPath -Encoding UTF8

          $process = $null
          try {
            $process = Start-Process `
              -FilePath $serverPath `
              -ArgumentList @("-config", $configPath) `
              -WorkingDirectory $smokeRoot `
              -PassThru

            $healthy = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              Start-Sleep -Milliseconds 500
              if ($process.HasExited) {
                throw "Embedded server exited before health check with code $($process.ExitCode)"
              }
              try {
                Invoke-RestMethod `
                  -Uri "http://127.0.0.1:$port/api/v1/health" `
                  -TimeoutSec 2 | Out-Null
                $healthy = $true
                break
              } catch {
                # Server may still be initializing SQLite and HTTP routes.
              }
            }
            if (-not $healthy) {
              throw "Embedded server did not pass /api/v1/health within 20 seconds"
            }
          } finally {
            if ($process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
          }

      - name: Upload unified Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: LocalLens-Windows-x64
          path: apps/local_lens/dist/LocalLens-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  flutter-android:
    name: Flutter client · Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/local_lens

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate Android platform project
        shell: bash
        run: |
          set -euo pipefail
          flutter create \
            --project-name local_lens \
            --org com.weepwood \
            --platforms android \
            .

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.CAMERA" />',
          ]
          for permission in permissions:
              if permission not in text:
                  text = text.replace(marker, marker + "\n    " + permission, 1)
          if 'android:usesCleartextTraffic="true"' not in text:
              text = text.replace(
                  "<application",
                  '<application android:usesCleartextTraffic="true"',
                  1,
              )
          manifest.write_text(text, encoding="utf-8")
          PY

          flutter pub get

      - name: Test Flutter client
        run: flutter test

      - name: Analyze Flutter client
        run: flutter analyze

      - name: Build Android APK
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION="0.6.1"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${MANUAL_TAG}" ]]; then
            VERSION="${MANUAL_TAG#v}"
          fi

          flutter build apk \
            --release \
            --build-name "$VERSION" \
            --build-number "${GITHUB_RUN_NUMBER}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/LocalLens-Android-universal.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: LocalLens-Android-universal
          path: apps/local_lens/dist/LocalLens-Android-universal.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs:
      - server-windows
      - flutter-windows
      - flutter-android
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main' &&
       startsWith(github.event.head_commit.message, 'release:'))
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: LocalLens-*
          path: dist
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/LocalLens-Windows-x64.zip
          test -f dist/LocalLens-Server-Windows-x64.zip
          test -f dist/LocalLens-Android-universal.apk

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum LocalLens-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Resolve release tag
        id: release_tag
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${MANUAL_TAG}"
          else
            TAG="v0.6.1"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -euo pipefail

          PRERELEASE_ARGS=()
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE_ARGS+=(--prerelease)
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "LocalLens $TAG" \
              --generate-notes \
              "${PRERELEASE_ARGS[@]}"
          fi
