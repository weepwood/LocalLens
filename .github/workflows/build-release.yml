name: Build and Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v0.6.0"
        required: true
        default: "v0.6.0"
        type: string

permissions:
  contents: read

concurrency:
  group: local-lens-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  FLUTTER_VERSION: "3.41.9"
  NODE_VERSION: "22.13.1"

jobs:
  server-windows:
    name: Go server · Windows x64
    runs-on: windows-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.mod
            server/go.sum

      - name: Resolve and download dependencies
        run: |
          go mod tidy
          go mod download

      - name: Test server
        run: go test ./...

      - name: Build standalone and embedded servers
        shell: pwsh
        env:
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $packageName = "LocalLens-Server-Windows-x64"
          $packageDir = Join-Path $PWD "dist/$packageName"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null

          $version = "0.6.0-dev"
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME.TrimStart("v")
          } elseif ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch" -and $env:MANUAL_TAG) {
            $version = $env:MANUAL_TAG.TrimStart("v")
          }

          go build -trimpath `
            -ldflags "-s -w -X main.version=$version" `
            -o (Join-Path $packageDir "LocalLensServer.exe") .

          go build -trimpath `
            -ldflags "-H=windowsgui -s -w -X main.version=$version" `
            -o (Join-Path $packageDir "LocalLensServerEmbedded.exe") .

          Copy-Item "config.example.json" (Join-Path $packageDir "config.example.json")
          New-Item -ItemType Directory -Force -Path (Join-Path $packageDir "bin") | Out-Null

          @"
          LocalLens Server $version
          ==========================

          Standalone mode:
          1. Copy config.example.json to config.json.
          2. Edit media library paths, public_url and api_token.
          3. Put ffmpeg.exe and ffprobe.exe in .\bin\ when video transcoding is needed.
          4. Start LocalLensServer.exe -config .\config.json.

          LocalLensServerEmbedded.exe is the no-console runtime used by the unified
          Windows client. Most users should install the LocalLens Windows client
          instead of starting this file manually.

          v0.6.0 adds the Windows unified host, automatic local configuration,
          embedded server lifecycle management and visual server settings.
          Existing databases and server configuration remain compatible.
          "@ | Set-Content -Path (Join-Path $packageDir "START-HERE.txt") -Encoding UTF8

          Compress-Archive -Path $packageDir -DestinationPath "dist/$packageName.zip" -Force

      - name: Upload server artifact
        uses: actions/upload-artifact@v7
        with:
          name: LocalLens-Server-Windows-x64
          path: server/dist/LocalLens-Server-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  flutter-windows:
    name: Flutter client · Windows x64
    needs: server-windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/local_lens

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download embedded server artifact
        uses: actions/download-artifact@v5
        with:
          name: LocalLens-Server-Windows-x64
          path: ${{ runner.temp }}/local-lens-server

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate Windows platform project
        shell: pwsh
        run: |
          flutter create `
            --project-name local_lens `
            --org com.weepwood `
            --platforms windows `
            .
          flutter pub get

      - name: Test Flutter client
        run: flutter test

      - name: Analyze Flutter client
        run: flutter analyze

      - name: Build Windows client
        shell: pwsh
        env:
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          $version = "0.6.0"
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME.TrimStart("v")
          } elseif ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch" -and $env:MANUAL_TAG) {
            $version = $env:MANUAL_TAG.TrimStart("v")
          }
          flutter build windows --release --build-name $version --build-number $env:GITHUB_RUN_NUMBER

      - name: Package unified Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packageName = "LocalLens-Client-Windows-x64"
          $packageDir = Join-Path $PWD "dist/$packageName"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item "build/windows/x64/runner/Release/*" $packageDir -Recurse -Force

          $serverArtifactDir = Join-Path $env:RUNNER_TEMP "local-lens-server"
          $serverZip = Get-ChildItem $serverArtifactDir -Filter "*.zip" -Recurse | Select-Object -First 1
          if (-not $serverZip) {
            throw "Embedded server artifact zip was not found"
          }

          $serverExtractDir = Join-Path $env:RUNNER_TEMP "local-lens-server-extracted"
          Expand-Archive -Path $serverZip.FullName -DestinationPath $serverExtractDir -Force
          $embeddedServer = Get-ChildItem $serverExtractDir -Filter "LocalLensServerEmbedded.exe" -Recurse | Select-Object -First 1
          if (-not $embeddedServer) {
            throw "LocalLensServerEmbedded.exe was not found in server artifact"
          }

          $runtimeDir = Join-Path $packageDir "runtime"
          $mediaToolsDir = Join-Path $runtimeDir "media-tools"
          New-Item -ItemType Directory -Force -Path $mediaToolsDir | Out-Null
          Copy-Item $embeddedServer.FullName (Join-Path $runtimeDir "LocalLensServer.exe") -Force

          @"
          Optional media tools
          ====================

          Put ffmpeg.exe and ffprobe.exe in this directory to enable video
          thumbnails, broad metadata compatibility and HLS transcoding.
          The LocalLens client detects these files when it creates local config.
          "@ | Set-Content -Path (Join-Path $mediaToolsDir "README.txt") -Encoding UTF8

          @"
          LocalLens Windows ${{ github.run_number }}
          =========================================

          Launch LocalLens.exe only. The application automatically creates a local
          configuration, starts the embedded server without a console window and
          connects through 127.0.0.1. Server data is stored under
          %LOCALAPPDATA%\LocalLens rather than this installation directory.
          "@ | Set-Content -Path (Join-Path $packageDir "START-HERE.txt") -Encoding UTF8

          if (-not (Test-Path (Join-Path $runtimeDir "LocalLensServer.exe"))) {
            throw "Unified Windows package is missing runtime/LocalLensServer.exe"
          }
          Compress-Archive -Path $packageDir -DestinationPath "dist/$packageName.zip" -Force

      - name: Upload Windows client artifact
        uses: actions/upload-artifact@v7
        with:
          name: LocalLens-Client-Windows-x64
          path: apps/local_lens/dist/LocalLens-Client-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  react-native-android:
    name: React Native client · Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/local_lens_mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/local_lens_mobile/package.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate React Native mobile project
        run: |
          npx expo install --check
          npx expo-doctor
          npm run typecheck

      - name: Resolve Android version
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION="0.6.0"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${MANUAL_TAG}" ]]; then
            VERSION="${MANUAL_TAG#v}"
          fi

          VERSION="$VERSION" BUILD_NUMBER="${GITHUB_RUN_NUMBER}" node <<'NODE'
          const fs = require('node:fs');
          const file = 'app.json';
          const config = JSON.parse(fs.readFileSync(file, 'utf8'));
          config.expo.version = process.env.VERSION;
          config.expo.android = {
            ...config.expo.android,
            versionCode: Number(process.env.BUILD_NUMBER),
          };
          fs.writeFileSync(file, `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - name: Generate Android project
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build Android APK
        working-directory: apps/local_lens_mobile/android
        run: |
          chmod +x gradlew
          ./gradlew app:assembleRelease --no-daemon

      - name: Prepare Android artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
            dist/LocalLens-Android-universal.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: LocalLens-Android-universal
          path: apps/local_lens_mobile/dist/LocalLens-Android-universal.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs:
      - server-windows
      - flutter-windows
      - react-native-android
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main' &&
       startsWith(github.event.head_commit.message, 'release:'))
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: LocalLens-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum LocalLens-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Resolve release tag
        id: release_tag
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${MANUAL_TAG}"
          else
            TAG="v0.6.0"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -euo pipefail

          PRERELEASE_ARGS=()
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE_ARGS+=(--prerelease)
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "LocalLens $TAG" \
              --generate-notes \
              "${PRERELEASE_ARGS[@]}"
          fi
