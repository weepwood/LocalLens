[package]
name = "local-lens-desktop"
version = "0.7.0-dev"
description = "LocalLens Tauri 2 desktop application"
authors = ["weepwood"]
edition = "2024"
rust-version = "1.85"
license = "MIT"

[lib]
name = "local_lens_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
local-lens-core = { path = "../../../rust/crates/local-lens-core" }
local-lens-server = { path = "../../../rust/crates/local-lens-server" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
